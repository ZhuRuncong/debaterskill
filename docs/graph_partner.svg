  <circle class="var" cx="748" cy="214" r="16"/>
  <text class="nlab" x="648" y="218" text-anchor="middle">p&#8242;<tspan class="sub" dy="3">1</tspan></text>
  <text class="nlab" x="748" y="218" text-anchor="middle">p&#8242;<tspan class="sub" dy="3">2</tspan></text>

