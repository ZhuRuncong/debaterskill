  <text class="flab" x="714" y="262">&#948;(p&#8242;<tspan class="sub" dy="3">1</tspan><tspan dy="-3"> &#8722; p&#8242;</tspan><tspan class="sub" dy="3">2</tspan><tspan dy="-3"> &#8722; g)</tspan></text>

