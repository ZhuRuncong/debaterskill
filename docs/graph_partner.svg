  <circle class="var" cx="748" cy="130" r="16"/>
  <text class="nlab" x="648" y="134" text-anchor="middle">s<tspan class="sub" dy="3">1</tspan></text>
  <text class="nlab" x="748" y="134" text-anchor="middle">s<tspan class="sub" dy="3">2</tspan></text>

  <rect class="fac" x="641.5" y="165.5" width="13" height="13"/>
  <rect class="fac" x="741.5" y="165.5" width="13" height="13"/>
