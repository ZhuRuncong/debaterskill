<svg xmlns="http://www.w3.org/2000/svg" viewBox="586 100 300 222" width="300" height="222" font-family="'Latin Modern Roman','Computer Modern Roman','Times New Roman',Times,serif">
  <style>
    .ink   { stroke:#111; fill:none; stroke-width:1.15; }
