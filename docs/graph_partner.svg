  </style>
  <rect x="586" y="100" width="300" height="222" fill="#fff"/>
<!-- ============================ panel (c) ============================ -->

  <path class="edge" d="M648,130 V214 M748,130 V214 M648,214 L698,258 M748,214 L698,258"/>

