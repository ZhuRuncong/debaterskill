<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 96 576 184" width="576" height="184" font-family="'Latin Modern Roman','Computer Modern Roman','Times New Roman',Times,serif">
  <style>
    .ink   { stroke:#111; fill:none; stroke-width:1.15; }
    .edge  { stroke:#111; fill:none; stroke-width:1.05; }
    .stub  { stroke:#111; fill:none; stroke-width:1.05; stroke-dasharray:3 3; }
    .grp   { stroke:#c2c2c2; fill:none; stroke-width:1; stroke-dasharray:4 4; }
    .var   { fill:#fff; stroke:#111; stroke-width:1.3; }
    .fac   { fill:#111; stroke:#111; stroke-width:1; }
    .ttl   { font-size:14.5px; fill:#111; }
    .nlab  { font-size:12.5px; fill:#111; font-style:italic; }
    .flab  { font-size:10px; fill:#111; }
    .key   { font-size:10.5px; fill:#666; }
    .note  { font-size:10.5px; fill:#444; font-style:italic; }
    .sub   { font-size:8px; font-style:normal; }
  </style>
  <rect x="28" y="96" width="576" height="184" fill="#fff"/>
<!-- ============================ panel (a) ============================ -->

  <!-- chain edges -->
  <path class="edge" d="M72,130 H128 M128,130 H196 M196,130 H260 M260,130 H328 M328,130 H392 M392,130 H432"/>
  <!-- room stubs -->
  <path class="edge" d="M128,130 V168 M260,130 V168 M392,130 V168"/>

  <!-- room boxes -->
  <rect class="var" x="92"  y="168" width="72" height="24" rx="5"/>
  <rect class="var" x="224" y="168" width="72" height="24" rx="5"/>
  <rect class="var" x="356" y="168" width="72" height="24" rx="5"/>
  <text class="flab" x="128" y="184" text-anchor="middle">rooms at t<tspan class="sub" dy="3">1</tspan></text>
  <text class="flab" x="260" y="184" text-anchor="middle">rooms at t<tspan class="sub" dy="3">2</tspan></text>
  <text class="flab" x="392" y="184" text-anchor="middle">rooms at t<tspan class="sub" dy="3">3</tspan></text>

  <!-- factors: prior and two drifts -->
  <rect class="fac" x="65.5"  y="123.5" width="13" height="13"/>
  <rect class="fac" x="189.5" y="123.5" width="13" height="13"/>
  <rect class="fac" x="321.5" y="123.5" width="13" height="13"/>
  <text class="flab" x="72"  y="113" text-anchor="middle">N(&#956;&#8320;, &#963;&#8320;&#178;)</text>
  <text class="flab" x="196" y="113" text-anchor="middle">&#947;&#178;&#916;t&#8321;</text>
  <text class="flab" x="328" y="113" text-anchor="middle">&#947;&#178;&#916;t&#8322;</text>

  <!-- skill nodes -->
  <circle class="var" cx="128" cy="130" r="16"/>
  <circle class="var" cx="260" cy="130" r="16"/>
  <circle class="var" cx="392" cy="130" r="16"/>
  <text class="nlab" x="128" y="134" text-anchor="middle">s<tspan class="sub" dy="3">i,1</tspan></text>
  <text class="nlab" x="260" y="134" text-anchor="middle">s<tspan class="sub" dy="3">i,2</tspan></text>
  <text class="nlab" x="392" y="134" text-anchor="middle">s<tspan class="sub" dy="3">i,3</tspan></text>
  <text class="nlab" x="446" y="136" text-anchor="middle">&#8943;</text>

  <text class="note" x="40" y="216">One chain per speaker; each room box expands to the room graph and ties together its eight speakers.</text>

  <!-- legend -->
  <circle class="var" cx="56" cy="258" r="10"/>
  <text class="key" x="72" y="262">variable</text>
  <rect class="fac" x="146" y="251.5" width="13" height="13"/>
  <text class="key" x="167" y="262">factor</text>

  </svg>
