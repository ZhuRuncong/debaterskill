    .var   { fill:#fff; stroke:#111; stroke-width:1.3; }
    .fac   { fill:#111; stroke:#111; stroke-width:1; }
    .ttl   { font-size:14.5px; fill:#111; }
    .nlab  { font-size:12.5px; fill:#111; font-style:italic; }
    .flab  { font-size:10px; fill:#111; }
    .key   { font-size:10.5px; fill:#666; }
    .note  { font-size:10.5px; fill:#444; font-style:italic; }
    .sub   { font-size:8px; font-style:normal; }
  </style>
  <rect x="58" y="372" width="860" height="362" fill="#fff"/>
