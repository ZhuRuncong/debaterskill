<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 372 860 362" width="860" height="362" font-family="'Latin Modern Roman','Computer Modern Roman','Times New Roman',Times,serif">
  <style>
    .ink   { stroke:#111; fill:none; stroke-width:1.15; }
